name: Deploy PN DARBAR Supabase Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/telegram-toss-webhook/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Telegram Toss Webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy telegram-toss-webhook --project-ref kytcjkmqmiroizieynoj
